name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug clearly.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open iscLauncher
        2. Click '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >
        The lines from around the problem, from Options → Open Log. The log holds no passwords or sign-ins, but it does
        name your games, repos and folders, so take out anything you'd rather not share.
      render: text
    validations:
      required: false
  # Options → Report a Problem fills these two in
  - type: input
    id: version
    attributes:
      label: iscLauncher version
      description: Shown under Options.
      placeholder: e.g. v1.1.12
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2
    validations:
      required: false
