name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.3)'
        required: true
        type: string

permissions: {}

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERTIFICATE != '' }}
    steps:
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}" -replace '^v', ''
          }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "TAG=v$ver" >> $env:GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag v${{ inputs.version }}
          git push origin v${{ inputs.version }}

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish iscLauncher.csproj
          -c Release
          -r win-x64
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -p:WindowsPackageType=None
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.VERSION }}
          -o publish

      - name: Sign executable with Authenticode
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String("${{ secrets.SIGNING_CERTIFICATE }}")
          $certPath  = Join-Path $env:RUNNER_TEMP "code-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          try {
            # Locate signtool.exe from the Windows SDK
            $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
                          -Recurse -Filter "signtool.exe" |
                        Where-Object { $_.FullName -match "x64" } |
                        Sort-Object FullName -Descending |
                        Select-Object -First 1 -ExpandProperty FullName

            # Sign all .exe and .dll files in the publish folder
            Get-ChildItem publish -Include *.exe,*.dll -Recurse | ForEach-Object {
              & $signtool sign /f $certPath `
                               /p "${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}" `
                               /tr http://timestamp.digicert.com `
                               /td sha256 `
                               /fd sha256 `
                               /v $_.FullName
            }
          }
          finally {
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
          }

      - name: Create release zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath iscLauncher-${{ steps.version.outputs.TAG }}-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          generate_release_notes: true
          files: iscLauncher-${{ steps.version.outputs.TAG }}-win-x64.zip
