name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Releases the next patch version; push a tag yourself for a minor or major bump
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERTIFICATE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            git fetch --tags --force -q
            $latest = git tag -l 'v*' |
              Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
              ForEach-Object { [version]($_ -replace '^v', '') } |
              Sort-Object -Descending |
              Select-Object -First 1
            if (-not $latest) { $latest = [version]'0.0.0' }
            $ver = "$($latest.Major).$($latest.Minor).$($latest.Build + 1)"
          } else {
            $ver = "${{ github.ref_name }}" -replace '^v', ''
            if ($ver -notmatch '^\d+\.\d+\.\d+$') {
              Write-Error "Tag '${{ github.ref_name }}' does not contain a valid version. Expected: v<major>.<minor>.<patch>"
              exit 1
            }
          }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "TAG=v$ver" >> $env:GITHUB_OUTPUT

      - name: Create and push tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag ${{ steps.version.outputs.TAG }} ${{ github.sha }}
          git push origin ${{ steps.version.outputs.TAG }}

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Publish x64
        run: >
          dotnet publish iscLauncher.csproj
          -c Release
          -r win-x64
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -p:WindowsPackageType=None
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.VERSION }}
          -o publish

      - name: Sign executables with Authenticode
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $certBytes = [Convert]::FromBase64String("${{ secrets.SIGNING_CERTIFICATE }}")
          $certPath  = Join-Path $env:RUNNER_TEMP "code-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          try {
            # Locate signtool.exe from the Windows SDK
            $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
                          -Recurse -Filter "signtool.exe" |
                        Where-Object { $_.FullName -match "x64" } |
                        Sort-Object FullName -Descending |
                        Select-Object -First 1 -ExpandProperty FullName

            if (-not $signtool) {
              Write-Error "signtool.exe not found in Windows SDK"
              exit 1
            }

            Write-Host "Using signtool: $signtool"

            # Sign all .exe and .dll files in the publish folder
            $files = Get-ChildItem publish -Include *.exe,*.dll -Recurse
            if ($files.Count -eq 0) {
              Write-Error "No .exe or .dll files found in publish folder"
              exit 1
            }

            foreach ($file in $files) {
              Write-Host "Signing $($file.FullName)..."
              & $signtool sign /f $certPath `
                               /p "${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}" `
                               /tr http://timestamp.digicert.com `
                               /td sha256 `
                               /fd sha256 `
                               /v $file.FullName
              if ($LASTEXITCODE -ne 0) {
                Write-Error "Failed to sign $($file.FullName) (exit code $LASTEXITCODE)"
                exit 1
              }
            }

            # Verify that signatures were applied
            foreach ($file in $files) {
              $sig = Get-AuthenticodeSignature $file.FullName
              if ($sig.Status -eq 'NotSigned') {
                Write-Error "No signature found on $($file.FullName)"
                exit 1
              }
              Write-Host "Verified signature on $($file.Name): Status=$($sig.Status), Issuer=$($sig.SignerCertificate.Issuer)"
            }

            Write-Host "All files signed successfully."
          }
          finally {
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
          }

      # Shipping a portable Git means addon sync works without installing anything. It's pinned and hash-checked, so a
      # changed download fails the release instead of shipping. Bundled after signing, since Git's files carry their own.
      - name: Bundle portable Git
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/git-for-windows/git/releases/download/v2.56.0.windows.2/MinGit-2.56.0.2-64-bit.zip' -OutFile mingit.zip
          if ((Get-FileHash mingit.zip -Algorithm SHA256).Hash -ne 'da35e72aa21c005a5a0d298cfbae110bc1609a815730ea0dde84b01a1b3cd3be') {
            Write-Error 'The MinGit download does not match its pinned SHA-256.'
            exit 1
          }
          Expand-Archive mingit.zip -DestinationPath publish/git

      - name: Create release zip
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.TAG }}"
          Compress-Archive -Path publish\* -DestinationPath "iscLauncher-$tag-win-x64.zip"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          generate_release_notes: true
          files: |
            iscLauncher-${{ steps.version.outputs.TAG }}-win-x64.zip
