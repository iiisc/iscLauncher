name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERTIFICATE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish iscLauncher.csproj
          -c Release
          -r win-x64
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -p:WindowsPackageType=None
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.VERSION }}
          -o publish

      - name: Sign executable with Authenticode
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String("${{ secrets.SIGNING_CERTIFICATE }}")
          $certPath  = Join-Path $env:RUNNER_TEMP "code-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          try {
            # Locate signtool.exe from the Windows SDK
            $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
                          -Recurse -Filter "signtool.exe" |
                        Where-Object { $_.FullName -match "x64" } |
                        Sort-Object FullName -Descending |
                        Select-Object -First 1 -ExpandProperty FullName

            # Sign all .exe and .dll files in the publish folder
            Get-ChildItem publish -Include *.exe,*.dll -Recurse | ForEach-Object {
              & $signtool sign /f $certPath `
                               /p "${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}" `
                               /tr https://timestamp.digicert.com `
                               /td sha256 `
                               /fd sha256 `
                               /v $_.FullName
            }
          }
          finally {
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
          }

      - name: Create release zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath iscLauncher-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: iscLauncher-${{ github.ref_name }}-win-x64.zip
