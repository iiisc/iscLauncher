name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, such as 1.2.0. Leave empty for the next patch version.'
        required: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build-and-release:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release notes list the commits since the previous release, so the history and tags are needed
          fetch-depth: 0
          # The build runs code from NuGet packages, so the write token isn't left in the git config; only the tag push gets it
          persist-credentials: false

      - name: Determine version
        id: version
        shell: pwsh
        # From the environment, so whatever is typed into the box can't become part of the script
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          $ver = "$env:REQUESTED".Trim().TrimStart('v')
          if (-not $ver) {
            $latest = git tag -l 'v*' |
              Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
              ForEach-Object { [version]($_ -replace '^v', '') } |
              Sort-Object -Descending |
              Select-Object -First 1
            if (-not $latest) { $latest = [version]'0.0.0' }
            $ver = "$($latest.Major).$($latest.Minor).$($latest.Build + 1)"
          }
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { Write-Error "'$ver' isn't a version like 1.2.0."; exit 1 }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "COMMIT=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          echo "TAG=v$ver" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Everything else about the build is in the project file. A folder rather than one exe: a single-file build
      # unpacks itself into %TEMP% for every new version and starts several times slower.
      - name: Publish
        run: dotnet publish iscLauncher.csproj -c Release -p:Version=${{ steps.version.outputs.VERSION }} -o publish/iscLauncher

      # The app sits in an iscLauncher folder inside the zip, so unzipping it anywhere can't spill its files into a
      # folder that holds other things
      - name: Create release zip
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.TAG }}"
          Compress-Archive -Path publish\iscLauncher -DestinationPath "iscLauncher-$tag-win-x64.zip"

      # GitHub builds its notes from pull requests, but changes here go straight to master, so the draft lists the
      # commits since the previous release, to be rewritten for users before publishing.
      - name: Write release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The latest published release, not the newest tag: an older failed run may have left a tag without a release
          $previous = gh release view --json tagName --jq .tagName 2>$null
          $range = if ($previous) { "$previous..HEAD" } else { "HEAD" }
          git log $range --no-merges --format='- %s' | Out-File -Encoding utf8 notes.md

      # Tagged only now, after the build succeeded, so a failed run doesn't use up a version number. Pushed with git
      # because GitHub refused to let the release action create the tag through its API with this token.
      - name: Push tag
        shell: pwsh
        env:
          TOKEN: ${{ github.token }}
        run: |
          git tag ${{ steps.version.outputs.TAG }} ${{ steps.version.outputs.COMMIT }}
          git push "https://x-access-token:$env:TOKEN@github.com/${{ github.repository }}.git" ${{ steps.version.outputs.TAG }}

      # A draft, because the app shows the notes before updating and commit messages aren't written for users. The
      # app's update check only sees published releases, so nobody is offered it until it's published.
      # gh comes with the runner, so the one step that can write to the repo runs no third-party code.
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ steps.version.outputs.TAG }}
          "iscLauncher-${{ steps.version.outputs.TAG }}-win-x64.zip"
          --repo ${{ github.repository }}
          --title ${{ steps.version.outputs.TAG }}
          --notes-file notes.md
          --verify-tag
          --draft
