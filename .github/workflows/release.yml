name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Releases the next patch version; push a tag yourself for a minor or major bump
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERTIFICATE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A manual release builds master as it is now, so re-running a failed one picks up fixes pushed since.
          # (Re-runs still use the workflow file of the original run; only the code is current.)
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
          # The release notes list the commits since the previous release, so the history and tags are needed
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $latest = git tag -l 'v*' |
              Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
              ForEach-Object { [version]($_ -replace '^v', '') } |
              Sort-Object -Descending |
              Select-Object -First 1
            if (-not $latest) { $latest = [version]'0.0.0' }
            $ver = "$($latest.Major).$($latest.Minor).$($latest.Build + 1)"
          } else {
            # The trigger only fires for v<major>.<minor>.<patch> tags
            $ver = "${{ github.ref_name }}".TrimStart('v')
          }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "COMMIT=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          echo "TAG=v$ver" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Test
        run: dotnet test Tests/iscLauncher.Tests.csproj -c Release

      # Unpackaged and self-contained come from the project file; these make it one compressed exe
      - name: Publish x64
        run: >
          dotnet publish iscLauncher.csproj
          -c Release
          -r win-x64
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.VERSION }}
          -o publish

      # Runs only when a signing certificate is stored in the repo's secrets
      - name: Sign
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $certPath = Join-Path $env:RUNNER_TEMP "code-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String("${{ secrets.SIGNING_CERTIFICATE }}"))
          try {
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object FullName -match 'x64' | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            $files = (Get-ChildItem publish -Include *.exe, *.dll -Recurse).FullName
            & $signtool sign /f $certPath /p "${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}" /tr http://timestamp.digicert.com /td sha256 /fd sha256 $files
            if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }
          }
          finally {
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
          }

      # Shipping a portable Git means addon sync works without installing anything. It's pinned and hash-checked, so a
      # changed download fails the release instead of shipping. Bundled after signing, since Git's files carry their own.
      - name: Bundle portable Git
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/git-for-windows/git/releases/download/v2.56.0.windows.2/MinGit-2.56.0.2-64-bit.zip' -OutFile mingit.zip
          if ((Get-FileHash mingit.zip -Algorithm SHA256).Hash -ne 'da35e72aa21c005a5a0d298cfbae110bc1609a815730ea0dde84b01a1b3cd3be') {
            Write-Error 'The MinGit download does not match its pinned SHA-256.'
            exit 1
          }
          Expand-Archive mingit.zip -DestinationPath publish/git

      - name: Create release zip
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.TAG }}"
          Compress-Archive -Path publish\* -DestinationPath "iscLauncher-$tag-win-x64.zip"

      # GitHub builds its notes from pull requests, but changes here go straight to master, so the notes list the
      # commits since the previous release instead. The app shows them before updating.
      - name: Write release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The latest published release, not the newest tag: an older failed run may have left a tag without a release
          $previous = gh release view --json tagName --jq .tagName 2>$null
          $range = if ($previous) { "$previous..HEAD" } else { "HEAD" }
          git log $range --no-merges --format='- %s' | Out-File -Encoding utf8 notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          # Only created now, after the build succeeded, so a failed run doesn't use up a version number
          target_commitish: ${{ steps.version.outputs.COMMIT }}
          body_path: notes.md
          files: |
            iscLauncher-${{ steps.version.outputs.TAG }}-win-x64.zip
